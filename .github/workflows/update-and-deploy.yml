name: Update airspace and deploy websites
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['state/**', 'web/data/**', 'web/staging/**', 'web/production/**', 'web/demo/**', 'web/archive/**', 'web/maritime/**', 'README.md']
permissions:
  contents: read
concurrency:
  group: airspace-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test geometry and filtering
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test refresh and monitor behavior
        run: |
          node tests/test_refresh.cjs
          node tests/test_monitor.cjs
          node tests/test_busy_ui.cjs
          node tests/test_export_filters.cjs
          node tests/test_shapefile.cjs
          node tests/test_view_tools.cjs
          node tests/test_monitor_ui.cjs
          node tests/test_translation.cjs
          node tests/test_operations.cjs
          node tests/test_range_drag.cjs
          node tests/test_spatial.cjs
          node tests/test_map_hover.cjs
          node tests/test_notifications.cjs
          node tests/test_security.mjs
      - name: Sync FAA worldwide classifications and changes
        env:
          FAA_CLIENT_ID: ${{ secrets.FAA_CLIENT_ID }}
          FAA_CLIENT_SECRET: ${{ secrets.FAA_CLIENT_SECRET }}
        run: |
          python scripts/sync_global.py --report /tmp/airspace-errors
      - name: Install official warning PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.20.1
      - name: Sync official navigational warnings
        run: python scripts/sync_maritime.py
      - name: Save bounded observation archive
        run: python scripts/archive_snapshots.py
      - name: Commit compact country snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/production web/maritime web/archive state
          if ! git diff --cached --quiet; then
            git commit -m 'Update airspace snapshots [skip ci]'
            git push origin HEAD:main
          fi
      - name: Remove retired fictional demo from published assets
        run: rm -rf web/demo
      - name: Build prototype access gate
        env:
          ALTA_VIEW_PASSWORD: ${{ secrets.ALTA_VIEW_PASSWORD }}
        run: python scripts/build_access.py
      - name: Build encrypted operations status
        env:
          ALTA_ADMIN_PASSWORD: ${{ secrets.ALTA_ADMIN_PASSWORD }}
        run: node scripts/build_operations.mjs
      # GITHUB_TOKEN commits do not trigger another workflow. Deploy in this same run.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: web
          retention-days: 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Check Cloudflare configuration
        id: cloudflare_config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment pending: add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN to repository Secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare Cloudflare Direct Upload project
        if: steps.cloudflare_config.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/prepare_cloudflare.py
      - name: Build protected Cloudflare artifact
        if: steps.cloudflare_config.outputs.ready == 'true'
        run: |
          mkdir -p cloudflare-dist
          cp -R web/. cloudflare-dist/
          cp security/worker.mjs cloudflare-dist/_worker.js
          printf '%s' '{"version":1,"include":["/*"],"exclude":[]}' > cloudflare-dist/_routes.json
      - name: Publish website and current JSON to Cloudflare Pages
        if: steps.cloudflare_config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-dist --project-name=alta-system --branch=main
      - name: Report partial source failures after publishing stale status
        shell: bash
        run: |
          count=$(cat /tmp/airspace-errors)
          if [ "$count" -gt 0 ] || [ "$(cat /tmp/maritime-errors)" -gt 0 ]; then
            echo "::error::$count country source(s) failed; previous valid data and failure status were published."
            exit 1
          fi

